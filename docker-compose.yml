services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: foodflix_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-foodflix}
      - DB_USERNAME=${DB_USERNAME:-foodflix}
      - DB_PASSWORD=${DB_PASSWORD:-foodflix}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - foodflix

  webserver:
    image: nginx:stable-alpine
    container_name: foodflix_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - foodflix

  db:
    image: mysql:8.0
    container_name: foodflix_db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_DATABASE:-foodflix}
      - MYSQL_USER=${DB_USERNAME:-foodflix}
      - MYSQL_PASSWORD=${DB_PASSWORD:-foodflix}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - foodflix_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - foodflix

networks:
  foodflix:
    driver: bridge

volumes:
  foodflix_db_data:
    driver: local
